name: Build AntForest

on:
  workflow_dispatch:
  push:
    branches: [ "dev" ]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build dylib
        run: |
          make all

      - name: Run tests
        run: |
          make test

      - name: Install dpkg
        run: |
          brew install dpkg

      - name: Build packages
        run: |
          mkdir -p Packages build/rootful-tmp build/rootless-tmp
          rm -rf Packages/*.deb build/rootful-tmp/* build/rootless-tmp/*

          VER=$(grep '^Version:' antforest/Package/DEBIAN/control | awk '{print $2}')
          echo "Package version: ${VER}"

          # Rootful
          cp -r antforest/Package/* build/rootful-tmp/
          cp build/AntForestPort-Ocean.dylib build/rootful-tmp/Library/MobileSubstrate/DynamicLibraries/antforest.dylib
          dpkg-deb -b build/rootful-tmp "Packages/com.vknote.antforest_${VER}_iphoneos-arm.deb"

          # Rootless：只拷 DEBIAN，载荷全部落 /var/jb（不可整棵 cp Package，否则 rootful 的 /Library 会混进包里）
          mkdir -p build/rootless-tmp/DEBIAN
          cp antforest/Package/DEBIAN/control build/rootless-tmp/DEBIAN/control
          sed -i '' 's/^Architecture: iphoneos-arm/Architecture: iphoneos-arm64/' build/rootless-tmp/DEBIAN/control
          printf '\n' >> build/rootless-tmp/DEBIAN/control
          mkdir -p build/rootless-tmp/var/jb/Library/MobileSubstrate/DynamicLibraries
          cp build/AntForestPort-Ocean.dylib build/rootless-tmp/var/jb/Library/MobileSubstrate/DynamicLibraries/antforest.dylib
          cp antforest/Package/Library/MobileSubstrate/DynamicLibraries/antforest.plist build/rootless-tmp/var/jb/Library/MobileSubstrate/DynamicLibraries/antforest.plist
          dpkg-deb -b build/rootless-tmp "Packages/com.vknote.antforest_${VER}_iphoneos-arm64.deb"

          # 断言：rootless 包里不允许再出现顶层 /Library 路径
          if dpkg-deb -c "Packages/com.vknote.antforest_${VER}_iphoneos-arm64.deb" | awk '{print $NF}' | grep -qE '^\./Library/'; then
            echo "❌ rootless 包里混入了 rootful 路径（./Library/…），安装会失败"; exit 1
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AntForest‑Packages
          path: |
            ${{ github.workspace }}/Packages/*.deb
